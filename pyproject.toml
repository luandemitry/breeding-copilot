[project]
name = "breeding-copilot"
version = "0.1.0"
description = "LangGraph agent that answers plant-breeding trial questions and recommends lines to advance (synthetic data)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlglot>=25.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Alternative LLM providers (see .env.example): uv sync --extra groq / --extra ollama
groq = ["langchain-groq>=0.2"]
ollama = ["langchain-ollama>=0.2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
